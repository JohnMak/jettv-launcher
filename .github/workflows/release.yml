name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Validate tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.1" ]; then
            echo "Tag v0.0.1 is the development baseline; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tag.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.tag.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.tag.outputs.skip == 'false'

      - name: Prepare release signing
        if: steps.tag.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.JETTV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.JETTV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.JETTV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JETTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret for $v"
              exit 1
            fi
            echo "::add-mask::${!v}"
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jettv-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/jettv-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "$RUNNER_TEMP/jettv-signing.properties"
          chmod 600 "$RUNNER_TEMP/jettv-release.jks" "$RUNNER_TEMP/jettv-signing.properties"
          echo "JETTV_SIGNING_PROPERTIES=$RUNNER_TEMP/jettv-signing.properties" >> "$GITHUB_ENV"

      - name: Test and build release APK
        if: steps.tag.outputs.skip == 'false'
        working-directory: launcher
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify version and package assets
        if: steps.tag.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          OUT=launcher/app/build/outputs/apk/release
          BUILT=$(jq -r '.elements[0].versionName' "$OUT/output-metadata.json")
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Built versionName '$BUILT' != tag version '$VERSION'"
            exit 1
          fi
          APK=$(jq -r '.elements[0].outputFile' "$OUT/output-metadata.json")
          mkdir -p dist
          cp "$OUT/$APK" "dist/jettv-launcher-$VERSION.apk"
          (cd dist && sha256sum "jettv-launcher-$VERSION.apk" > "jettv-launcher-$VERSION.apk.sha256")
          cat "dist/jettv-launcher-$VERSION.apk.sha256"
          cp "dist/jettv-launcher-$VERSION.apk" "dist/jettv-launcher-latest.apk"
          (cd dist && sha256sum "jettv-launcher-latest.apk" > "jettv-launcher-latest.apk.sha256")
          cat "dist/jettv-launcher-latest.apk.sha256"

      - name: Publish GitHub release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/jettv-launcher-$VERSION.apk" \
            "dist/jettv-launcher-$VERSION.apk.sha256" \
            "dist/jettv-launcher-latest.apk" \
            "dist/jettv-launcher-latest.apk.sha256" \
            --title "JetTV Launcher $VERSION" \
            --generate-notes \
            --verify-tag
