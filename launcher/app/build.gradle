plugins {
    id 'com.android.application'
}

apply from: 'version.gradle'

// Release signing: properties file (storeFile, storePassword, keyAlias, keyPassword) at
// $JETTV_SIGNING_PROPERTIES or <repo root>/materials/signing.properties. Only release tasks need it.
def signingPropsFile = new File(System.getenv('JETTV_SIGNING_PROPERTIES') ?: "${rootDir.parentFile}/materials/signing.properties")
def signingProps = new Properties()
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }) {
        if (!signingPropsFile.isFile()) {
            throw new GradleException("Release signing properties not found at ${signingPropsFile}; set JETTV_SIGNING_PROPERTIES or create materials/signing.properties")
        }
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
            if (!signingProps.getProperty(key)) {
                throw new GradleException("Release signing properties ${signingPropsFile} lack key '${key}'")
            }
        }
    }
}

android {
    namespace 'com.johnmak.atvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.johnmak.atvlauncher'
        minSdk 30
        targetSdk 34
        versionCode appVersion.code
        versionName appVersion.name
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (signingPropsFile.isFile()) {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ADB client over TCP (Apache-2.0); lamp commands go to the device's own adbd on loopback.
    implementation 'dev.mobile:dadb:2.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
