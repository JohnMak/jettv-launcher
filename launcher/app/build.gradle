plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexmak.atvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alexmak.atvlauncher'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ADB client over TCP (Apache-2.0); lamp commands go to the device's own adbd on loopback.
    implementation 'dev.mobile:dadb:2.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
